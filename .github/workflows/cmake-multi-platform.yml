
name: C++ Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            compiler: GCC
            cpp_compiler: g++

          - os: ubuntu-latest
            compiler: Clang
            cpp_compiler: clang++

          - os: windows-latest
            compiler: MSVC
            cpp_compiler: cl

          - os: macos-latest
            compiler: AppleClang
            cpp_compiler: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
